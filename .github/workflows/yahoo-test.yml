name: Yahoo connectivity test

on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Install yfinance
        run: pip install yfinance pandas

      - name: Try downloading every ticker
        run: |
          python << 'PYEOF'
          import yfinance as yf
          import pandas as pd
          from datetime import datetime, timedelta

          TICKERS = ["SPY", "FEZ", "EEM", "GC=F", "CL=F", "LQD", "HYG"]
          today = datetime.utcnow().date()
          ok, bad = [], []

          print(f"Runner date (UTC): {today}\n")
          print(f"{'TICKER':<8} {'ROWS':>6}  {'LAST DATE':<12} {'AGE':>5}  STATUS")
          print("-" * 55)

          for t in TICKERS:
              try:
                  df = yf.download(t, period="1mo", progress=False, auto_adjust=False)
                  if df is None or df.empty:
                      print(f"{t:<8} {0:>6}  {'-':<12} {'-':>5}  EMPTY")
                      bad.append(t)
                      continue
                  last = df.index[-1].date()
                  age = (today - last).days
                  flag = "OK" if age <= 5 else f"STALE ({age}d)"
                  if age > 5:
                      bad.append(t)
                  else:
                      ok.append(t)
                  print(f"{t:<8} {len(df):>6}  {str(last):<12} {age:>4}d  {flag}")
              except Exception as e:
                  print(f"{t:<8} {'-':>6}  {'-':<12} {'-':>5}  ERROR: {type(e).__name__}: {e}")
                  bad.append(t)

          print("-" * 55)
          print(f"\nWorking: {len(ok)}/{len(TICKERS)}  {ok}")
          if bad:
              print(f"FAILED:  {bad}")
              raise SystemExit(1)
          print("\nAll tickers downloaded successfully from the GitHub runner.")
          PYEOF
